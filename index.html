<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live FC</title>
<style>
:root{--bg:#0b1220;--card:#131c2e;--tx:#e8eefc;--mu:#8fa0c0;--ac:#22e07a;--bad:#ff5468;--warn:#ffb020}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:#0e1a30;padding:8px 14px;display:flex;gap:10px;align-items:center;border-bottom:2px solid var(--ac)}
.ov{background:var(--ac);color:#04210f;font-weight:800;font-size:20px;border-radius:10px;padding:4px 10px}
main{max-width:900px;margin:auto;padding:12px}h2,h3{margin:.2em 0 .5em}.c{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.bar{height:8px;background:#22304d;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:7px;color:var(--mu)}.row b{color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#04210f;font-weight:700;margin:3px 0}button.s{background:#22304d;color:var(--tx)}button.d{background:var(--bad);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#0e1a30;border-top:1px solid #22304d;z-index:5}nav button{flex:1 0 auto;background:none;color:var(--mu);border-radius:0;font-size:12px;margin:0;padding:12px 11px}nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--ac)}
#md{display:none;position:fixed;inset:0;background:#000b;z-index:9;align-items:center;justify-content:center;padding:12px;overflow:auto}#md.on{display:flex}.mb{background:var(--card);border-radius:16px;padding:16px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
.op{display:block;width:100%;text-align:left;background:#22304d;color:var(--tx)}.op small{display:block;color:var(--mu);font-weight:400}
input,select{font:inherit;width:100%;padding:8px;margin:3px 0 8px;border-radius:8px;border:1px solid #2c3d60;background:#0b1220;color:var(--tx)}label{font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px;text-align:left;border-bottom:1px solid #22304d}.me{color:var(--ac);font-weight:700}.tag{display:inline-block;background:#22304d;border-radius:20px;padding:2px 9px;font-size:12px;margin:2px}.al{background:#3a2a12;border-left:4px solid var(--warn);padding:8px;border-radius:8px;margin-bottom:8px}
</style></head><body>
<header id="hd"><b style="color:var(--ac);font-size:18px">LIVE FC</b></header><main id="mn"></main><nav id="nv"></nav><div id="md"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== CONFIGURACIÓN SUPABASE (déjalo vacío para jugar solo con guardado local) ======
const SB_URL='',SB_KEY='';
// ====== DATOS DE EJEMPLO EDITABLES: NO son oficiales ni están actualizados ======
const LG={ES:'LaLiga',EN:'Premier League',IT:'Serie A',DE:'Bundesliga',FR:'Ligue 1'},CUP={ES:'Copa del Rey',EN:'FA Cup',IT:'Coppa Italia',DE:'DFB-Pokal',FR:'Coupe de France'};
const CLB={ES:'Real Madrid 88,FC Barcelona 86,Atlético de Madrid 82,Sevilla 73,Villarreal 72,Valencia 69,Getafe 62,Almería 57',EN:'Manchester City 89,Arsenal 87,Liverpool 87,Chelsea 82,Tottenham 80,Newcastle 78,Brighton 72,Burnley 58',IT:'Inter 85,Juventus 82,Milan 82,Napoli 81,Roma 78,Atalanta 79,Torino 66,Empoli 57',DE:'Bayern Múnich 89,Bayer Leverkusen 86,Borussia Dortmund 82,RB Leipzig 82,Stuttgart 75,Friburgo 70,Mainz 64,Darmstadt 56',FR:'PSG 86,Mónaco 77,Marsella 76,Lille 75,Lyon 74,Niza 72,Reims 65,Metz 57'};
const NA={'España':88,'Argentina':90,'Brasil':89,'Francia':90,'Inglaterra':87,'Alemania':85,'Italia':82,'Portugal':85,'Países Bajos':84,'Uruguay':80,'Colombia':78,'México':76,'Estados Unidos':74,'Rep. Dominicana':52,'Otra':62};
const CL=[];for(const l in CLB)CLB[l].split(',').forEach(x=>{const i=x.lastIndexOf(' ');CL.push({n:x.slice(0,i),l,s:+x.slice(i+1)})});
const SCH=[0,'L','L','E','C','N','E','L','L','C','E','N','L','C','L'],TN={L:'Liga',C:'Copa',E:'Europa',N:'Selección'};
const AN={vel:'Velocidad',res:'Resistencia',fue:'Fuerza',pas:'Pase',reg:'Regate',tir:'Tiro',def:'Definición',mar:'Marcaje',ent:'Entradas',vis:'Visión',pos:'Posicionamiento',ref:'Reflejos'};
const W={POR:{ref:3,pos:2,vis:1,pas:1},DFC:{mar:3,ent:3,fue:2,pos:2,vel:1},LAT:{vel:2,res:2,ent:1,pas:1,mar:1,reg:1},MED:{pas:3,vis:3,res:1,reg:1,ent:1,tir:1},EXT:{vel:3,reg:3,pas:1,tir:1,def:1},DEL:{def:3,tir:3,pos:2,vel:1,reg:1,fue:1}};
const PN={POR:'Portero',DFC:'Defensa central',LAT:'Lateral',MED:'Mediocampista',EXT:'Extremo',DEL:'Delantero'};
const EN={rep:'Reputación',comp:'Compañeros',ent:'Entrenador',dir:'Directiva',afi:'Afición',pre:'Prensa',mo:'Moral',fa:'Fatiga',fo:'Forma',m:'Dinero (k€)',sp:'Patrocinio (k€/año)',fam:'Gasto familiar (k€/sem)'};
const TR={des:['Descanso','',-32,0,'Recuperas energía. Sin mejora.'],tec:['Técnico','pas,reg,tir,vis',8,3,'Mejora pase, regate, tiro, visión.'],fis:['Físico','vel,res,fue',16,6,'Mejora cuerpo; sube fatiga y riesgo.'],tac:['Táctico','pos,mar,ent,def',8,2,'Mejora posicionamiento y defensa.'],esp:['Específico del puesto','K',13,4,'Atributos clave de tu posición.'],ext:['Intensivo (doble sesión)','K',26,10,'Mejora doble, mucha fatiga y riesgo de lesión.']};
const MM={A:[['Balón dividido en la frontal del área',[['Disparar de primera','tir,def',10,'g','Riesgo alto'],['Filtrar un pase al compañero','pas,vis',2,'a','Riesgo medio'],['Conservar y circular','pas',-18,'s','Riesgo bajo']]],['Uno contra uno con el lateral rival',[['Encarar y regatear','reg,vel',8,'g','Riesgo alto'],['Centrar al área','pas',0,'a','Riesgo medio'],['Pasar atrás','pas',-18,'s','Riesgo bajo']]],['Penalti a favor: ¿quién lo lanza?',[['Lanzarlo tú','tir,def',-6,'g','Riesgo medio'],['Cedérselo a un compañero','',-80,'s','Sin riesgo']]]],
D:[['Delantero rival lanzado hacia tu área',[['Entrada limpia','ent,mar',8,'d','Riesgo alto'],['Retroceder y cerrar','pos,vel',0,'d','Riesgo medio'],['Falta táctica','mar',-20,'f','Riesgo bajo, posible tarjeta']]],['Córner en contra',[['Marcar al hombre','mar,fue',0,'d','Riesgo medio'],['Defender en zona','pos',-6,'d','Riesgo bajo']]],['Salida de balón bajo presión',[['Pase largo al extremo','pas,vis',10,'a','Riesgo alto'],['Pase corto seguro','pas',-14,'s','Riesgo bajo']]]],
P:[['Disparo a bocajarro',[['Estirada','ref',6,'d','Riesgo alto'],['Achicar el ángulo','pos',0,'d','Riesgo medio']]],['Balón aéreo al área pequeña',[['Salir a por él','fue,pos',6,'d','Riesgo alto'],['Quedarte bajo palos','ref',-8,'d','Riesgo bajo']]],['Penalti en contra',[['Lanzarte a un lado','ref',16,'d','Riesgo alto']]]],
X:[['Un rival te provoca y te empuja',[['Ignorarlo','',-40,'s','Sin riesgo'],['Encararlo','',20,'c','Riesgo alto, tarjeta']]],['Molestia muscular en el minuto 70',[['Seguir jugando','res,fue',14,'m','Riesgo de lesión'],['Pedir el cambio','',-80,'s','Sin riesgo']]]]};
const EV=[['Tras el partido te preguntan por el entrenador.',[['Elogiarlo',{ent:6,pre:1}],['Criticar su táctica',{ent:-9,pre:6,rep:3,afi:2}],['Dar largas',{pre:-3}]]],
['Se te ocurre publicar una broma en redes sociales.',[['Publicarla',{afi:4,rep:3},50,{pre:-8,rep:-6,dir:-3}],['No publicar',{}]]],
['Tus amigos te invitan a una fiesta nocturna.',[['Ir',{mo:8,comp:3},55,{pre:-8,rep:-8,fa:15,ent:-6}],['Descansar en casa',{fa:-10,mo:-2}]]],
['Una marca te ofrece un contrato de patrocinio.',[['Aceptar',{sp:60,pre:2,m:20}],['Pedir más dinero',{sp:120,m:40},45,{rep:-2}],['Rechazar',{afi:2}]]],
['Vestuario: un compañero discute contigo por un balón.',[['Hablar y zanjarlo',{comp:5,ent:2}],['Encararlo',{comp:-3,rep:4,mo:5},45,{comp:-10,ent:-5,mo:-5}]]],
['El entrenador te pide compromiso total.',[['Prometer dar el máximo',{ent:7,fa:12,mo:-3}],['No prometer nada',{ent:-4}]]],
['Tu hermano pide 50k€ prestados.',[['Prestárselos',{m:-50,mo:5}],['Negarte',{mo:-6,rep:-1}]]],
['Tu agente propone invertir 80k€ en un negocio.',[['Invertir',{m:200},40,{m:-80}],['Pasar',{}]]],
['Los ultras te presionan tras una mala racha.',[['Saludar a la grada',{afi:6,mo:-2}],['Ignorarlos',{afi:-6}],['Responder en redes',{afi:6,rep:3},40,{afi:-10,pre:-5,rep:-4}]]],
['Llegas tarde al entrenamiento.',[['Pedir perdón',{ent:-2,m:-10,comp:2}],['Poner una excusa',{},50,{ent:-8,dir:-4,m:-30}]]],
['Te invitan a una gala benéfica.',[['Asistir',{rep:5,pre:4,fa:6,m:-20}],['Declinar',{}]]],
['La directiva te cita para hablar de tu futuro.',[['Pedir más protagonismo',{ent:5,dir:2,mo:4},45,{dir:-8,ent:-3}],['Mostrar lealtad',{dir:6,afi:3}]]]];
const FN=['Marco','Diego','Lucas','Mateo','Théo','Jonas','Rafa','Enzo','Nico','Álvaro','Bruno','Hugo'],SN=['Vidal','Ferrante','Keller','Duarte','Moreau','Santoro','Ibáñez','Lindqvist','Barros','Novak','Castell','Brandt'];
// ====== LÓGICA ======
const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,Math.round(v))),pick=a=>a[R(0,a.length-1)],avg=a=>a.reduce((x,y)=>x+y,0)/a.length,fm=k=>k>=1000?(k/1000).toFixed(1)+' M€':Math.round(k)+' k€',nm=()=>pick(FN)+' '+pick(SN);
const ovr=(at,p)=>{const w=W[p];let s=0,t=0;for(const k in w){s+=at[k]*w[k];t+=w[k]}return Math.round(s/t)};
let G=null,TAB='jug',MO=[],sb=null,uid=null,stt;
const eov=()=>ovr(G.at,G.p.pos)-(G.inj?(G.inj.w>0?10:4):0),KEYS=()=>Object.keys(W[G.p.pos]);
const ec=()=>G.p.nac&&NA[G.p.nac];
function modal(h,o){MO=o.map(x=>x.f);$('#md').innerHTML='<div class=mb>'+h+o.map((x,i)=>`<button class="op ${x.c||''}" onclick="clk(${i})">${x.l}${x.h?'<small>'+x.h+'</small>':''}</button>`).join('')+'</div>';$('#md').className='on'}
const clk=i=>{$('#md').className='';MO[i]&&MO[i]()};
const L=m=>{G.log.unshift(`T${G.s}·S${G.w}: ${m}`);G.log=G.log.slice(0,10)};
function bar(l,v,inv,min){const x=min?(v+100)/2:v,g=inv?100-x:x;return `<div class=row><span>${l}</span><b>${Math.round(v)}</b></div><div class=bar><i style="width:${Math.max(2,x)}%;background:${g>=65?'var(--ac)':g>=35?'var(--warn)':'var(--bad)'}"></i></div>`}
async function cloud(){try{if(!SB_URL||!window.supabase)return;sb=supabase.createClient(SB_URL,SB_KEY);let{data:{session}}=await sb.auth.getSession();if(!session){const r=await sb.auth.signInAnonymously();session=r.data.session}uid=session&&session.user.id}catch(e){console.warn(e);sb=null}}
function save(){if(!G)return;G.ts=Date.now();localStorage.setItem('livefc',JSON.stringify(G));clearTimeout(stt);stt=setTimeout(async()=>{try{if(sb&&uid)await sb.from('careers').upsert({user_id:uid,data:G,updated_at:new Date().toISOString()})}catch(e){console.warn(e)}},1200)}
async function load(){let a=null;try{a=JSON.parse(localStorage.getItem('livefc'))}catch(e){}try{if(sb&&uid){const{data}=await sb.from('careers').select('data').eq('user_id',uid).maybeSingle();if(data&&data.data&&(!a||data.data.ts>a.ts))a=data.data}}catch(e){}return a}
function newTab(){G.tab={};CL.filter(c=>c.l==G.club.l).forEach(c=>G.tab[c.n]=0)}
function euCalc(rank){G.eu=rank?(rank<=2?'CL':rank<=4?'EL':null):(G.club.s>=80?'CL':G.club.s>=70?'EL':null);G.ea=!!G.eu}
function newRival(){G.rv={n:nm(),o:eov()+R(-3,7),c:pick(CL).n,w:0,l:0}}
function start(){const f=id=>$('#'+id).value,age=+f('f_ed'),pos=f('f_pos'),at={},st=f('f_st'),h=+f('f_h');
 const base=36+Math.min(age-16,10)*1.6;for(const k in AN)at[k]=cl(base+R(0,10)+(W[pos][k]||0)*6);
 const sb2={Creativo:['pas','vis','reg'],Físico:['fue','res','ent'],Rápido:['vel','reg','def'],Técnico:['reg','tir','pas'],Táctico:['pos','mar','vis']}[st];sb2.forEach(k=>at[k]=cl(at[k]+4));
 if(h>190){at.fue=cl(at.fue+4);at.vel=cl(at.vel-3)}else if(h<172){at.reg=cl(at.reg+4);at.fue=cl(at.fue-4)}
 const o=ovr(at,pos),club=CL.find(c=>c.n==f('f_cl')),pr=f('f_pe');
 G={v:1,ts:0,p:{name:f('f_n')||'Jugador',nac:f('f_na'),edad:age,pos,foot:f('f_pi'),h,st,pe:pr,col:f('f_co')},at,pot:Math.max(o+2,Math.min(95,o+R(6,20)-Math.max(0,age-16)*.8)),club,ct:{w:Math.round((o-40)**2*.9*(.6+club.s/100)),y:3},rep:Math.round((o-50)/2),rel:{comp:50+(pr=='Líder'?10:0),ent:50,dir:50,afi:45+(pr=='Humilde'?5:0),pre:45+(pr=='Polémico'?-5:0)},fin:{sav:20,ls:1,sp:0,fam:0,hs:[20]},b:{fa:10,fo:55,mo:60},inj:null,perm:[],s:1,w:1,plan:'tec',st2:null,hist:[],tr:[],aw:[],caps:{pj:0,g:0,a:0},cr:0,ca:true,er:0,log:[],res:{},offers:[],pm:null,nat:{}};
 G.st={pj:0,g:0,a:0,tj:0,tr:0,rs:0,rn:0};G.sT=0;newTab();euCalc();newRival();genOffers();L('Comienza tu carrera en '+club.n);save();TAB='jug';go()}
function intro(){const ks=Object.keys(NA);modal(`<h2>Nueva carrera</h2><label>Nombre</label><input id=f_n value="Mi Jugador"><label>Nacionalidad</label><select id=f_na>${ks.map(k=>`<option>${k}</option>`).join('')}</select><label>Edad</label><input id=f_ed type=number min=16 max=34 value=18 oninput=fc()><label>Posición</label><select id=f_pos>${Object.keys(PN).map(k=>`<option value=${k}>${PN[k]}</option>`).join('')}</select><label>Pierna</label><select id=f_pi><option>Derecha</option><option>Izquierda</option><option>Ambas</option></select><label>Altura (cm)</label><input id=f_h type=number min=160 max=205 value=180><label>Estilo</label><select id=f_st><option>Creativo</option><option>Físico</option><option>Rápido</option><option>Técnico</option><option>Táctico</option></select><label>Personalidad</label><select id=f_pe><option>Líder</option><option>Ambicioso</option><option>Tranquilo</option><option>Polémico</option><option>Humilde</option></select><label>Color de camiseta</label><input id=f_co type=color value="#22e07a"><label>Club inicial (según tu edad)</label><select id=f_cl></select>`,[{l:'Empezar',f:start},{l:'Volver',c:'s',f:home}]);fc()}
function fc(){const a=+$('#f_ed').value||18,mx=a<=19?66:a<=23?74:a<=27?82:90;$('#f_cl').innerHTML=CL.filter(c=>c.s<=mx).map(c=>`<option value="${c.n}">${c.n} (${LG[c.l]}, nivel ${c.s})</option>`).join('')}
function tut(){modal('<h2>Cómo jugar</h2><p>1) Elige un <b>plan de entrenamiento</b> semanal. 2) Pulsa <b>Avanzar semana</b> en Partidos: habrá eventos y decisiones. 3) En los partidos tus decisiones dependen de tus atributos, forma y fatiga. 4) Cuida relaciones, dinero y lesiones. 5) Al terminar la temporada (14 semanas) llegan premios, ofertas y renovaciones. Todo se guarda solo.</p>',[{l:'Entendido',f:home}])}
function home(){$('#hd').innerHTML='<b style="color:var(--ac);font-size:18px">LIVE FC</b>';$('#nv').innerHTML='';$('#mn').innerHTML=`<div class=c style="text-align:center;margin-top:40px"><h1 style="font-size:44px;margin:0;color:var(--ac)">LIVE FC</h1><p>Simulador de carrera de futbolista</p>${G?'<button onclick=go()>Continuar carrera</button><br>':''}<button class=s onclick=intro()>Nueva carrera</button><br><button class=s onclick=tut()>Tutorial</button><p style="font-size:12px;color:var(--mu)">Clubes y plantillas: datos de ejemplo, no oficiales.</p></div>`}
function go(){$('#nv').innerHTML=[['jug','Mi jugador'],['club','Club'],['par','Partidos'],['ent','Entrenamiento'],['rel','Relaciones'],['fin','Finanzas'],['mer','Mercado'],['sel','Selección'],['tem','Temporada']].map(([k,l])=>`<button class="${TAB==k?'on':''}" onclick="TAB='${k}';go()">${l}</button>`).join('');
 $('#hd').innerHTML=`<span class=ov>${eov()}</span><div style="flex:1"><b>${G.p.name}</b><div style="font-size:12px;color:var(--mu)">${G.club.n} · T${G.s} Semana ${Math.min(G.w,14)}/14</div></div><button class=s onclick=home()>☰</button>`;
 $('#mn').innerHTML=({jug:vJug,club:vClub,par:vPar,ent:vEnt,rel:vRel,fin:vFin,mer:vMer,sel:vSel,tem:vTem})[TAB]()}
const en=()=>cl(100-G.b.fa*.9);
const repL=r=>r<-40?'Villano':r<-10?'Polémico':r<15?'Poco conocido':r<45?'Conocido':r<75?'Estrella':'Leyenda';
function alerts(){let a='';if(G.inj)a+=`<div class=al>🩹 ${G.inj.w>0?G.inj.n+': '+G.inj.w+' sem.':'Molestias residuales: '+G.inj.m+' sem. (−rendimiento)'}</div>`;if(G.fin.sav<0)a+='<div class=al>💸 Estás en deuda: afecta moral y directiva.</div>';if(G.ct.y<=0)a+='<div class=al>📄 Sin contrato: elige una oferta en Mercado.</div>';if(G.b.fa>75)a+='<div class=al>😮‍💨 Fatiga alta: más riesgo de lesión.</div>';return a}
function vJug(){const o=eov(),w=G.at,tr=[];if(w.tir>=72)tr.push('Disparo potente');if(w.pas>=72)tr.push('Pase largo');if(w.reg>=72)tr.push('Regateador');if(w.vel>=75)tr.push('Explosivo');if(w.mar>=72)tr.push('Muro defensivo');if(w.ref>=72)tr.push('Reflejos felinos');if(w.vis>=72)tr.push('Visionario');if(w.fue>=72)tr.push('Imponente');
 return alerts()+`<div class=c><h2>${G.p.name} <span style="font-size:13px;color:var(--mu)">${G.p.nac} · ${G.p.edad} años · ${PN[G.p.pos]} · ${G.p.foot} · ${G.p.h}cm · ${G.p.st} · ${G.p.pe}</span></h2><div class=g><div>${bar('Media',o)}${bar('Potencial',G.pot)}</div><div><div class=row><span>Contrato</span><b>${G.club.n} · ${G.ct.y} año(s)</b></div><div class=row><span>Sueldo</span><b>${fm(G.ct.w)}/año</b></div><div class=row><span>Reputación</span><b>${repL(G.rep)} (${G.rep})</b></div></div></div>${tr.map(t=>`<span class=tag>${t}</span>`).join('')}</div>
 <div class=c><h3>Estado físico</h3><div class=g><div>${bar('Energía',en())}${bar('Forma',G.b.fo)}</div><div>${bar('Moral',G.b.mo)}${bar('Fatiga',G.b.fa,1)}</div></div>${G.perm.length?'<p>Secuelas permanentes: '+G.perm.join(', ')+'</p>':''}</div>
 <div class=c><h3>Atributos</h3><div class=g>${Object.keys(AN).map(k=>`<div style="${W[G.p.pos][k]?'':'opacity:.7'}">${bar(AN[k]+(W[G.p.pos][k]?' ★':''),G.at[k])}</div>`).join('')}</div><p style="font-size:12px;color:var(--mu)">★ = atributos que cuentan para la media de tu posición.</p></div><div class=c><h3>Noticias</h3>${G.log.map(x=>`<div class=row><span>${x}</span></div>`).join('')}</div>`}
